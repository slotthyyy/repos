<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repos</title>
<style>
  :root {
    --bg: #fff; --fg: #333; --link: #00f; --head: #000; --rule: #ccc;
    --hover: #eee; --muted: #888; --err: #b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1b; --fg: #ccc; --link: #7aa2ff; --head: #fff; --rule: #444;
      --hover: #262626; --muted: #888; --err: #ff6b6b;
    }
  }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 4px;
    font: 10pt sans-serif; color: var(--fg); background: var(--bg);
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  #page { max-width: 1100px; margin: 0 auto; padding: 0 4px; }

  /* header */
  table.header { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
  table.header td { padding: 4px 0; vertical-align: middle; }
  td.logo { width: 96px; }
  td.logo svg { display: block; fill: var(--head); }
  td.main { font-size: 250%; padding-left: 10px; white-space: nowrap; }
  td.main a { color: var(--head); }
  td.sub { color: var(--muted); border-top: 1px solid var(--rule); padding-left: 10px; }

  /* tabs */
  table.tabs { width: 100%; border-collapse: collapse; border-bottom: solid 3px var(--rule); margin-top: 1em; }
  table.tabs td { padding: 0 1em; vertical-align: bottom; }
  table.tabs td a { padding: 2px .75em; color: var(--muted); font-size: 110%; }
  table.tabs td a.active { color: var(--head); background: var(--rule); }
  table.tabs td.form { text-align: right; padding-right: 0; }
  table.tabs td.form input { font-size: 90%; background: var(--bg); color: var(--fg); border: 1px solid var(--rule); padding: 1px 4px; }

  .content { padding: 1em 0 0 0; border-bottom: solid 3px var(--rule); }

  /* repo list */
  table.list { width: 100%; border-collapse: collapse; border: none; margin-bottom: 1em; }
  table.list th { font-weight: bold; text-align: left; padding: .1em .5em .05em .5em; vertical-align: baseline; border-bottom: solid 1px var(--rule); }
  table.list th a { color: var(--head); }
  table.list th a.sorted::after { content: " \25BE"; }
  table.list th a.sorted.asc::after { content: " \25B4"; }
  table.list td { padding: .1em .5em .1em .5em; border: none; vertical-align: top; }
  table.list tbody tr:hover { background: var(--hover); }
  table.list td.idle, table.list td.owner { white-space: nowrap; }
  table.list td.links { white-space: nowrap; }
  table.list td.links a { margin-right: .5em; }
  table.list td.name a { font-weight: normal; }

  .state { padding: 1em .5em; color: var(--muted); }
  .state.error { color: var(--err); }

  .footer { margin-top: .5em; text-align: right; font-size: 80%; color: var(--muted); }
  .footer a { color: var(--muted); }

  @media (max-width: 640px) {
    td.main { font-size: 160%; white-space: normal; }
    td.logo { width: 56px; }
    table.list th.owner, table.list td.owner,
    table.list th.desc, table.list td.desc { display: none; }
  }
</style>
</head>
<body>
<div id="page">

  <table class="header">
    <tr>
      <td class="logo" rowspan="2">
        <!-- GitHub mark -->
        <svg width="80" height="80" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </td>
      <td class="main"><a href="#" id="title">Repos</a></td>
    </tr>
    <tr>
      <td class="sub" id="subtitle">GitHub repositories</td>
    </tr>
  </table>

  <table class="tabs">
    <tr>
      <td><a class="active" href="#">index</a><a id="about-tab" href="#" target="_blank" rel="noopener">about</a></td>
      <td class="form"><input id="filter" type="search" placeholder="filter repos" aria-label="Filter repositories"></td>
    </tr>
  </table>

  <div class="content">
    <div id="state" class="state">Loading repositories…</div>
    <table class="list" id="list" hidden>
      <thead>
        <tr>
          <th class="name"><a href="#" data-sort="name">Name</a></th>
          <th class="desc"><a href="#" data-sort="desc">Description</a></th>
          <th class="owner"><a href="#" data-sort="owner">Owner</a></th>
          <th class="idle"><a href="#" data-sort="idle">Idle</a></th>
          <th>Links</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="footer" id="footer"></div>
</div>

<script>
/* ============ SETTINGS ============ */
const CONFIG = {
  // Your GitHub username (or organisation name).
  // You can also test any account with ?user=name in the URL.
  username: "slotthyyy",

  includeForks: false,      // list repos you forked from others
  includeArchived: true,    // list archived repos
  title: "Repos",           // page title shown in the header
  subtitle: "GitHub repositories, updated automatically",
  cacheMinutes: 10          // browser cache, avoids the 60 requests/hour API limit
};
/* ================================== */

const params = new URLSearchParams(location.search);
const USER = (params.get("user") || CONFIG.username || "").trim();

const $ = id => document.getElementById(id);
const stateEl = $("state"), listEl = $("list"), rowsEl = $("rows");

let repos = [];
let sortKey = "idle", sortAsc = true;   // newest activity first, like cgit

document.title = CONFIG.title;
$("title").textContent = CONFIG.title;
$("subtitle").textContent = CONFIG.subtitle;

function setState(msg, isError) {
  stateEl.hidden = false;
  stateEl.className = "state" + (isError ? " error" : "");
  stateEl.textContent = msg;
  listEl.hidden = true;
}

/* cgit-style idle time: "11 days", "6 months" */
function idleText(date) {
  const s = Math.max(0, (Date.now() - date.getTime()) / 1000);
  const units = [
    ["year", 365 * 86400], ["month", 30 * 86400], ["week", 7 * 86400],
    ["day", 86400], ["hour", 3600], ["min.", 60]
  ];
  for (const [name, secs] of units) {
    const n = Math.floor(s / secs);
    if (n >= 1) return n + " " + name + (name !== "min." && n > 1 ? "s" : "");
  }
  return "just now";
}

function cacheGet(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const { t, data } = JSON.parse(raw);
    if (Date.now() - t < CONFIG.cacheMinutes * 60000) return data;
  } catch (e) {}
  return null;
}
function cacheSet(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), data })); } catch (e) {}
}

async function fetchRepos(user) {
  const key = "repos:" + user;
  const cached = cacheGet(key);
  if (cached) return cached;

  const all = [];
  for (let page = 1; page <= 10; page++) {
    const res = await fetch(
      "https://api.github.com/users/" + encodeURIComponent(user) +
      "/repos?per_page=100&sort=pushed&page=" + page,
      { headers: { "Accept": "application/vnd.github+json" } }
    );
    if (res.status === 404) throw new Error("GitHub user \u201C" + user + "\u201D was not found.");
    if (res.status === 403 || res.status === 429) {
      throw new Error("GitHub API rate limit reached. Try again in a few minutes.");
    }
    if (!res.ok) throw new Error("GitHub API returned status " + res.status + ".");
    const batch = await res.json();
    all.push(...batch);
    if (batch.length < 100) break;
  }
  cacheSet(key, all);
  return all;
}

function link(href, text) {
  const a = document.createElement("a");
  a.href = href; a.textContent = text; a.rel = "noopener";
  return a;
}

function render() {
  const q = $("filter").value.trim().toLowerCase();
  const view = repos.filter(r =>
    !q || r.name.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q)
  );

  const cmp = {
    name:  (a, b) => a.name.localeCompare(b.name),
    desc:  (a, b) => a.desc.localeCompare(b.desc),
    owner: (a, b) => a.owner.localeCompare(b.owner),
    idle:  (a, b) => b.pushed - a.pushed     // smaller idle first
  }[sortKey];
  view.sort((a, b) => sortAsc ? cmp(a, b) : cmp(b, a));

  rowsEl.textContent = "";
  for (const r of view) {
    const tr = document.createElement("tr");

    const tdName = document.createElement("td");
    tdName.className = "name";
    tdName.appendChild(link(r.url, r.name));

    const tdDesc = document.createElement("td");
    tdDesc.className = "desc";
    tdDesc.appendChild(link(r.url, r.desc || "No description"));

    const tdOwner = document.createElement("td");
    tdOwner.className = "owner";
    tdOwner.appendChild(link(r.ownerUrl, r.owner));

    const tdIdle = document.createElement("td");
    tdIdle.className = "idle";
    tdIdle.textContent = idleText(r.pushedDate);
    tdIdle.title = r.pushedDate.toLocaleString();

    const tdLinks = document.createElement("td");
    tdLinks.className = "links";
    tdLinks.append(
      link(r.url, "summary"),
      link(r.url + "/commits/" + encodeURIComponent(r.branch), "log"),
      link(r.url + "/tree/" + encodeURIComponent(r.branch), "tree")
    );

    tr.append(tdName, tdDesc, tdOwner, tdIdle, tdLinks);
    rowsEl.appendChild(tr);
  }

  if (!view.length) {
    setState(q ? "No repositories match your filter." : "No public repositories found.");
    return;
  }
  stateEl.hidden = true;
  listEl.hidden = false;

  document.querySelectorAll("th a[data-sort]").forEach(a => {
    const on = a.dataset.sort === sortKey;
    a.className = on ? "sorted" + (sortAsc ? "" : " asc") : "";
  });
}

async function init() {
  if (!USER) {
    setState("No GitHub username set. Open index.html and set CONFIG.username, or add ?user=yourname to the URL.", true);
    return;
  }

  $("about-tab").href = "https://slotthyyy.me";
  $("title").href = "https://github.com/" + encodeURIComponent(USER);

  try {
    const raw = await fetchRepos(USER);
    repos = raw
      .filter(r => (CONFIG.includeForks || !r.fork) && (CONFIG.includeArchived || !r.archived))
      .map(r => ({
        name: r.name,
        desc: r.description || "",
        owner: r.owner.login,
        ownerUrl: r.owner.html_url,
        url: r.html_url,
        branch: r.default_branch || "main",
        pushed: new Date(r.pushed_at || r.updated_at).getTime(),
        pushedDate: new Date(r.pushed_at || r.updated_at)
      }));
    render();
    $("footer").textContent = "generated from the GitHub API at " +
      new Date().toISOString().replace("T", " ").slice(0, 19) + " UTC";
  } catch (err) {
    setState(err.message || "Could not load repositories.", true);
  }
}

document.querySelectorAll("th a[data-sort]").forEach(a => {
  a.addEventListener("click", e => {
    e.preventDefault();
    const k = a.dataset.sort;
    if (k === sortKey) sortAsc = !sortAsc; else { sortKey = k; sortAsc = true; }
    render();
  });
});
$("filter").addEventListener("input", render);

init();
</script>
</body>
</html>
